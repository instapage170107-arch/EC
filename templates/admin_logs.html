<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quality Compliance &amp; Event Register &mdash; PackSort OS</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #0b0d13;
      --bg-surface: #111520;
      --bg-surface-elevated: #161c2b;
      --border-subtle: #222a3f;
      --border-strong: #2e3955;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.88rem;
      min-height: 100vh;
      margin: 0;
    }

    .top-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.65rem 1.5rem;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: 0.04em;
      color: #fff;
      text-decoration: none;
    }

    .brand-logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      display: grid;
      place-items: center;
      color: #0b0d13;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .station-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      border-left: 1px solid var(--border-subtle);
      padding-left: 0.8rem;
      margin-left: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-industrial {
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 6px;
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }
    .btn-industrial:hover {
      background: #1c2336;
      color: #fff;
      border-color: #3b4767;
    }

    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-header {
      padding: 0.75rem 1.25rem;
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .industrial-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.8rem;
    }

    .industrial-table th {
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }

    .industrial-table td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      vertical-align: middle;
    }

    .industrial-table tbody tr:hover td {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<header class="top-header">
  <div class="container-fluid px-3 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
      <a href="/" class="brand-mark">
        <span class="brand-logo-icon">P</span>
        <span>PACKSORT<span style="font-weight:300;opacity:0.75;margin-left:2px;">OS</span></span>
      </a>
      <span class="station-tag d-none d-md-inline-block">Compliance &bull; Historical Register</span>
    </div>

    <a href="/" class="btn-industrial">
      <i class="bi bi-arrow-left"></i>
      <span>Back to Viewport</span>
    </a>
  </div>
</header>

<main class="container-fluid px-3 py-4">
  <div class="panel">
    <div class="panel-header">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-database-check text-info"></i>
        <span>Master Quality Inspection Register (Historical Database)</span>
      </div>
      <span class="text-muted font-monospace" style="font-size:0.72rem;">STORAGE: SQLITE3</span>
    </div>
    <div class="table-responsive">
      <table class="industrial-table">
        <thead>
          <tr>
            <th style="width: 70px;">Record #</th>
            <th style="width: 220px;">Timestamp (UTC)</th>
            <th>Defect Classification</th>
            <th>Inference Confidence</th>
            <th>Pneumatic Action</th>
            <th>Latency (ms)</th>
            <th style="width: 120px;">QA Audit State</th>
          </tr>
        </thead>
        <tbody>
          {{rows}}
        </tbody>
      </table>
    </div>
  </div>
</main>

</body>
</html>
