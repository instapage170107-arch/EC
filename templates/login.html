<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Security Gateway &mdash; PackSort OS</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #0b0d13;
      --bg-surface: #111520;
      --bg-surface-elevated: #161c2b;
      --border-subtle: #222a3f;
      --border-strong: #2e3955;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #0284c7;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .auth-terminal {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    .terminal-header {
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1.25rem 1.5rem;
      text-align: center;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .brand-logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      display: grid;
      place-items: center;
      color: #0b0d13;
      font-size: 1rem;
      font-weight: 800;
    }

    .terminal-sub {
      font-family: var(--font-mono);
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .terminal-body {
      padding: 1.75rem 1.5rem 1.5rem;
    }

    .form-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }

    .input-field {
      background: #080a0f !important;
      border: 1px solid var(--border-subtle) !important;
      color: #fff !important;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      transition: border-color 0.15s ease;
    }

    .input-field:focus {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15) !important;
      outline: none;
    }

    .btn-auth {
      background: #0284c7;
      border: 1px solid #38bdf8;
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.65rem;
      border-radius: 6px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .btn-auth:hover {
      background: #0369a1;
      color: #fff;
    }

    .hint-chip {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border-subtle);
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      text-align: center;
      margin-top: 1rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-decoration: none;
      margin-top: 1.25rem;
      transition: color 0.15s ease;
    }
    .back-link:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

<div class="auth-terminal">
  <div class="terminal-header">
    <div class="brand-mark">
      <span class="brand-logo-icon">P</span>
      <span>PACKSORT<span style="font-weight:300;opacity:0.75;">OS</span></span>
    </div>
    <div class="terminal-sub">Security Access &bull; Quality Audit Terminal</div>
  </div>

  <div class="terminal-body">
    <form method="post" action="/admin/login">
      <div class="mb-3">
        <label class="form-label">Operator / Admin ID</label>
        <div class="input-group">
          <input type="text" name="username" class="form-control input-field" placeholder="admin" required autofocus>
        </div>
      </div>
      
      <div class="mb-3">
        <label class="form-label">Security Passkey</label>
        <div class="input-group">
          <input type="password" name="password" class="form-control input-field" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-auth mt-2">
        <i class="bi bi-shield-lock"></i>
        <span>Authenticate Session</span>
      </button>

      <div class="hint-chip">
        Station Default Credentials: <strong class="text-white">admin</strong> / <strong class="text-white">admin</strong>
      </div>
    </form>
  </div>
</div>

<a href="/" class="back-link">
  <i class="bi bi-arrow-left"></i>
  <span>Return to Live Inspection Terminal</span>
</a>

</body>
</html>
